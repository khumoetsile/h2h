name: CI

on:
  pull_request:
  push:
    branches-ignore: [main, master]   # main is covered by the deploy workflow
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rivalis_dev
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: rivalis_dev
      DB_NAME_TEST: rivalis_test
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Run backend tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
        working-directory: backend
      # Put the failing tests in the run's annotations, where they can be read without opening the full log.
      - name: Summarise failures
        if: failure()
        working-directory: backend
        run: |
          msg=$(grep -E "✖|failing tests|AssertionError|Error:|expected|actual|test/.*.test.js:[0-9]+" test-output.txt | head -60 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Backend test failures::$msg"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --watch=false
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
